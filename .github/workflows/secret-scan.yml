name: secret-scan
on: [push, pull_request]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No env or dev-vars files committed
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)|(^|/)\.dev\.vars$'; then
            echo "An env or .dev.vars file is committed. Remove it and rotate any keys in it."; exit 1
          fi
      - name: Gitleaks (full history)
        # Runs the pinned CLI directly. gitleaks-action@v2 fails on a repo's first push (it scans root^..HEAD).
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --redact -v .
