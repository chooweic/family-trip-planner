name: secret-scan
on: [push, pull_request]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No env or dev-vars files committed
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)|(^|/)\.dev\.vars$'; then
            echo "An env or .dev.vars file is committed. Remove it and rotate any keys in it."; exit 1
          fi
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
